[package]
name = "vc-reader"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.92"
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
dotenvy = "0.15.7"
futures-util = "0.3.34"
poise = "0.7"
regex = "1.13.1"
rusqlite = { version = "0.42.0", features = ["bundled", "chrono"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serenity = "0.12"
songbird = "0.6"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "net", "signal"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-normalization = "0.1.26"
unicode-segmentation = "1.13.3"
